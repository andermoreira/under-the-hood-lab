name: track-c-real-linux
on:
  push:
    paths:
      - "labs/low-level/C08/**"
      - "labs/low-level/C09/**"
      - "labs/low-level/C10/**"
      - "labs/low-level/C11/**"
      - ".github/workflows/track-c-real-linux.yml"
  pull_request:
    paths:
      - "labs/low-level/C08/**"
      - "labs/low-level/C09/**"
      - "labs/low-level/C10/**"
      - "labs/low-level/C11/**"
      - ".github/workflows/track-c-real-linux.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and architecture
        run: |
          test "$(uname -m)" = x86_64
          gcc --version
          readelf --version
          python3 --version
      - name: C08 real syscall lab
        run: make -C labs/low-level/C08 test
      - name: C09 real SIGABRT lab
        run: make -C labs/low-level/C09 test
      - name: C09 real GDB backtrace
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          ulimit -c 0
          gdb -q -batch -ex "set pagination off" -ex "run abort" -ex "bt" --args labs/low-level/C09/crash abort > c09-gdb.log 2>&1
          grep -F "C09_BEFORE_ABORT" c09-gdb.log
          grep -E "SIGABRT|Program received signal" c09-gdb.log
          grep -E "crash.c:[0-9]+" c09-gdb.log
      - name: C10 real procfs lab
        run: make -C labs/low-level/C10 test
      - name: C11 static and dynamic ELF lab
        run: make -C labs/low-level/C11 test
      - name: Capture ELF metadata
        if: always()
        run: |
          mkdir -p build/track-c
          if test -f labs/low-level/C11/dynamic; then
            readelf -l -d labs/low-level/C11/dynamic > build/track-c/dynamic-elf.txt
          fi
          if test -f labs/low-level/C11/static; then
            readelf -l -d labs/low-level/C11/static > build/track-c/static-elf.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-c-real-linux-evidence
          path: |
            build/track-c/
            c09-gdb.log
          if-no-files-found: warn
