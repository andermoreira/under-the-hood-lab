name: track-c-real-linux
on:
  push:
    paths:
      - "labs/low-level/C08/**"
      - "labs/low-level/C11/**"
      - ".github/workflows/track-c-real-linux.yml"
  pull_request:
    paths:
      - "labs/low-level/C08/**"
      - "labs/low-level/C11/**"
      - ".github/workflows/track-c-real-linux.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and architecture
        run: |
          test "$(uname -m)" = x86_64
          gcc --version
          readelf --version
          python3 --version
      - name: C08 real syscall lab
        run: make -C labs/low-level/C08 test
      - name: C11 static and dynamic ELF lab
        run: make -C labs/low-level/C11 test
      - name: Capture ELF metadata
        if: always()
        run: |
          mkdir -p build/track-c
          if test -f labs/low-level/C11/dynamic; then
            readelf -l -d labs/low-level/C11/dynamic > build/track-c/dynamic-elf.txt
          fi
          if test -f labs/low-level/C11/static; then
            readelf -l -d labs/low-level/C11/static > build/track-c/static-elf.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-c-real-linux-evidence
          path: build/track-c/
          if-no-files-found: warn
