name: gates
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make verify

  hardware-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Nand2Tetris desktop simulator (third-party mirror of software suite)
        run: |
          git clone --depth 1 https://github.com/tcarreira/nand2tetris.git /tmp/nand2tetris
          test -f /tmp/nand2tetris/tools/HardwareSimulator.sh
          chmod +x /tmp/nand2tetris/tools/HardwareSimulator.sh
      - name: Simulator baseline self-test
        run: |
          cd /tmp/nand2tetris/projects/01
          /tmp/nand2tetris/tools/HardwareSimulator.sh Not.tst
      - name: Execute HDL suite
        env:
          N2T_HOME: /tmp/nand2tetris
        run: |
          set -o pipefail
          make test-hdl-official 2>&1 | tee hardware-simulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-simulator-evidence
          path: |
            hardware-simulator.log
            hardware/nand2tetris/tests/*.out
          if-no-files-found: warn
