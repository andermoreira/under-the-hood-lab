name: gates
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make verify

  hardware-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Nand2Tetris desktop simulator (third-party mirror of software suite)
        run: |
          git clone --depth 1 https://github.com/tcarreira/nand2tetris.git /tmp/nand2tetris
          test -f /tmp/nand2tetris/tools/HardwareSimulator.sh
          chmod +x /tmp/nand2tetris/tools/HardwareSimulator.sh
      - name: Execute HDL suite
        env:
          N2T_HOME: /tmp/nand2tetris
        run: |
          set -o pipefail
          make test-hdl-official 2>&1 | tee hardware-simulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-simulator-evidence
          path: |
            hardware-simulator.log
            hardware/nand2tetris/tests/*.out
          if-no-files-found: warn

  kernel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Limine protocol header
        run: |
          curl --fail --location --retry 3 --output /tmp/limine.h https://raw.githubusercontent.com/limine-bootloader/limine-protocol/trunk/include/limine.h
          test -s /tmp/limine.h
      - name: Build and inspect freestanding ELF
        env:
          LIMINE_HEADER: /tmp/limine.h
        run: |
          make test-kernel-build
          readelf -l build/kernel/kernel.elf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-kernel-elf
          path: build/kernel/kernel.elf
          if-no-files-found: warn

  kernel-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso
      - name: Fetch Limine binaries and protocol header
        run: |
          git clone --depth 1 --branch v9.x-binary https://github.com/limine-bootloader/limine.git /tmp/limine
          curl --fail --location --retry 3 --output /tmp/limine.h https://raw.githubusercontent.com/limine-bootloader/limine-protocol/trunk/include/limine.h
          test -x /tmp/limine/limine
      - name: Boot QEMU and assert serial marker
        env:
          LIMINE_HEADER: /tmp/limine.h
          LIMINE_DIR: /tmp/limine
        run: make test-kernel-boot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b02-qemu-boot-evidence
          path: |
            build/kernel/serial.log
            build/kernel/qemu.log
            build/kernel/kernel.elf
          if-no-files-found: warn
