name: Low-level C01
on:
  push:
    paths:
      - 'labs/low-level/**'
      - 'docs/track-c/**'
      - 'Makefile'
      - '.github/workflows/low-level.yml'
  pull_request:
    paths:
      - 'labs/low-level/**'
      - 'docs/track-c/**'
      - 'Makefile'
      - '.github/workflows/low-level.yml'
permissions:
  contents: read
jobs:
  c01:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Linux x86-64 assembly lab
        run: make test-low-level
      - name: Inspect ELF
        run: make -C labs/low-level/C01 inspect
